name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Required for npm trusted publishing: semantic-release exchanges this OIDC
  # token for a short-lived npm credential, so there is no NPM_TOKEN to leak.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # @semantic-release/npm 13 requires ^22.14 || >=24.10.
          node-version: 24
          cache: pnpm

      # setup-node ships npm 10.x; OIDC trusted publishing needs 11.5.1+.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Release validation
        run: pnpm run validate:release

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
        run: pnpm exec semantic-release
