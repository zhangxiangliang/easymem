name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Required for npm trusted publishing: semantic-release exchanges this OIDC
  # token for a short-lived npm credential, so there is no NPM_TOKEN to leak.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # @semantic-release/npm 13 requires ^22.14 || >=24.10.
          node-version: 24
          cache: npm

      # OIDC trusted publishing needs npm 11.5.1 or newer.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci
        env:
          HUSKY: 0

      - name: Release validation
        run: npm run validate:release

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
        run: npx semantic-release
